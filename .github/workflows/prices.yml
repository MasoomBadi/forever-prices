# Hourly auction prices for Companion for WoW Forever.
#
# Safety rules (keep them when editing):
#   - Runs only on its schedule, by hand, or from the app server's cron (a workflow_dispatch with from=cron, sent
#     with a fine-grained token that can only start this repo's workflows). Never add pull_request /
#     pull_request_target / push triggers: those can hand the secrets to code from a branch or a fork.
#   - No third-party actions. The only action is GitHub's own checkout, pinned to a full commit SHA.
#   - The job's GitHub token can only read this repo, and checkout doesn't keep it on disk.
#   - Secrets reach only the one step that needs them, as environment variables. Nothing prints them;
#     prices.py masks the access token Blizzard returns and scrubs secrets out of any error it prints.
#   - Never turn on `set -x`, step debug logging, or upload artifacts from this job.
#   - The secrets live only in the `prices` environment, which only the main branch can use. Keep them out of
#     the repository-level secrets.
name: prices

on:
  schedule:
    # Blizzard refreshes the auction houses about :17 past the hour. GitHub drops many scheduled runs, so the job
    # is due four times an hour and prices.py skips a run while the server's prices are under 45 minutes old.
    # The app server's cron starts the same run four times an hour too (from=cron), since GitHub's schedule can go
    # hours without starting one.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "hand = always pull; cron = skip while prices are fresh"
        type: choice
        options: [hand, cron]
        default: hand

permissions:
  contents: read

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    environment: prices
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pull prices and upload
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          PRICES_UPLOAD_KEY: ${{ secrets.PRICES_UPLOAD_KEY }}
          PRICES_TRIGGER: ${{ inputs.from }}
        run: python3 -I prices.py
